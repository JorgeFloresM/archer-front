<div class="min-h-screen flex items-center justify-center bg-archer-bg px-4">
  <!-- Tarjeta del Login -->
  <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8">
    <!-- Encabezado / Logo -->
    <div class="text-center mb-8">
      <!-- Un ícono temporal que representa un paquete/logística -->
      <div
        class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-archer-blue mb-4"
      >
        <svg
          class="w-8 h-8 text-archer-green"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M13 10V3L4 14h7v7l9-11h-7z"
          />
        </svg>
      </div>
      <h2 class="text-2xl font-bold text-archer-blue">Archer Control</h2>
      <p class="text-sm text-gray-500 mt-2">
        Ingresa tus credenciales para acceder al panel operativo.
      </p>
    </div>

    <!-- Formulario (Llama al método onLogin() cuando se envía) -->
    <form (ngSubmit)="onLogin()">
      <div class="space-y-5">
        <!-- Input de Correo -->
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1"
            >Correo electrónico</label
          >
          <input
            type="email"
            [(ngModel)]="email"
            id="email"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-archer-green focus:border-transparent outline-none transition-all"
            placeholder="admin@archerlogistica.com"
            required
          />
        </div>

        <!-- Input de Contraseña -->
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1"
            >Contraseña</label
          >
          <input
            type="password"
            [(ngModel)]="password"
            id="password"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-archer-green focus:border-transparent outline-none transition-all"
            placeholder="••••••••"
            required
          />
        </div>

        <!-- Recordarme y Olvidé Contraseña -->
        <div class="flex items-center justify-between text-sm">
          <label class="flex items-center text-gray-600 cursor-pointer">
            <input
              type="checkbox"
              class="w-4 h-4 text-archer-blue rounded border-gray-300 focus:ring-archer-green cursor-pointer"
            />
            <span class="ml-2">Recordarme</span>
          </label>
          <a
            href="#"
            class="text-archer-lightBlue hover:text-archer-blue font-medium transition-colors"
            >¿Olvidaste tu contraseña?</a
          >
        </div>

        <!-- Botón de Enviar -->
        <button
          type="submit"
          class="w-full bg-archer-blue hover:bg-opacity-90 text-white font-semibold py-3 px-4 rounded-lg transition-all duration-200 shadow-md"
        >
          Iniciar Sesión
        </button>
      </div>
    </form>
  </div>
</div>
